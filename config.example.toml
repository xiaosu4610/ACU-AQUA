# AQUA Gateway 配置示例（占位符版——把本文件复制为 config.toml 并填入自己的值）
# 红线：代码不含任何运营事实，以下字段全部由运营者自定义。

# 站点信息（前端 /v1/meta 渲染源）
[site]
name = "My Gateway"
domain = "api.example.com"
docs_url = "https://example.com/#/api"
qq_group = ""              # 留空则前端不显示
qq_group_url = ""

[database]
driver = "sqlite"
path = "data/aqua.db"

[server]
listen = "0.0.0.0:8787"

# 充值渠道（易支付协议，MD5 签名）；支持环境变量覆盖：AQUA_EPAY_GATEWAY/PID/KEY/NOTIFY_BASE/RETURN_BASE
[epay]
gateway = "https://your-epay-host"   # 易支付网关地址
pid = "1000"                         # 商户 ID
key = "your-merchant-key"            # 商户密钥
notify_base = "https://api.example.com"   # 回调域名（网关收 /v1/pay/notify）
return_base = "https://www.example.com"   # 支付完成跳转域名

# ===== 上游线：新增一条线 = 追加一个 [[lines]] 块 =====
# 每条线是一套独立的转发 + 计费体系，可混合任意 OpenAI 兼容上游。
[[lines]]
id = "line-a"              # 线标识 = 模型前缀（line-a/model-x）
name = "加速通道"
mode = "per_call"          # 按次计费
base_url = "https://upstream.example.com/v1"
keys = ["sk-your-upstream-key-1", "sk-your-upstream-key-2"]
auth_style = "bearer"      # bearer | x-api-key

[[lines.models]]
site_id = "model-x"        # 站内名：line-a/model-x
upstream_id = "vendor-model-x"
per_call_cost = 1000       # 上游成本（微元/次）——保本线计算，绝不外泄
per_call_sell = 2000       # 售价（微元/次，普通组）

[[lines]]
id = "line-b"
name = "计量通道"
mode = "per_token"         # 按量计费（三段价）
base_url = "https://upstream2.example.com/v1"
keys = ["sk-your-key-1"]
key_face_micro = 67980000  # 每把密钥面值（微元）——面值台账；0=不限
vip_multiplier_num = 9     # vip 折扣 = 普通售价 × 9/10（分数表达，整数零精度损失）
vip_multiplier_den = 10

[[lines.models]]
site_id = "model-y"
upstream_id = "vendor-model-y"
# 成本率（微元/百万tokens）——内部台账，绝不外泄
in_cost_rate10 = 12000000
cache_cost_rate10 = 1500000
out_cost_rate10 = 36000000
# 售价率（rate10 = 微元/千token×10，普通组）
in_sell_rate10 = 60000
cache_sell_rate10 = 7500
out_sell_rate10 = 180000

[[lines.models]]
site_id = "image-model"    # 图片模型：按张计费
upstream_id = "vendor-image-model"
image = true
per_image_cost = 200000    # 成本（微元/张）
per_image_sell = 100000    # 售价（微元/张，普通组）

# 系统在线更新（双镜像源：gitee 主仓库 + github 自动同步镜像，管理后台入口）
# 支持 AQUA_UPDATE_REPO / AQUA_UPDATE_TOKEN / AQUA_UPDATE_ASSET_NAME / AQUA_UPDATE_SERVICE / AQUA_UPDATE_ENABLED 环境变量覆盖
[update]
enabled = false            # 是否启用在线更新入口（默认关；启用后管理后台才显示"检查更新"）
repo = "your-gitee-user/your-repo"      # gitee 主仓库（release 元数据 + release 附件源）
mirror_repo = "your-github-user/your-repo"   # github 镜像仓库（服务器侧主源：tags + raw 下载）
# gitee 私有仓库访问令牌（公开仓库可空）——机密字段，建议用环境变量 AQUA_UPDATE_TOKEN 注入，不落盘
token = ""
asset_name = "aqua-gateway-go-linux-amd64"   # 发行版附件名（linux-amd64 二进制），留空用默认
asset_dir = "assets"       # 仓库内附件目录（raw 下载路径前缀），留空用默认
service = "aqua-gateway-go"   # systemd 服务名（更新后自重启），留空用默认
api_base = ""              # gitee v5 API 地址（默认官方 https://gitee.com/api/v5；服务器无法直连 gitee 时可指向国内跳板反代）
proxy = ""                 # 出站代理（http://host:port），更新请求走代理（海外服务器被 gitee CDN 拦截时使用；空=走环境代理/直连）
