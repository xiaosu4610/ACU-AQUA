# AQUA Gateway 配置示例（占位符版——把本文件复制为 config.toml 并填入自己的值）
# 红线：代码不含任何运营事实，以下字段全部由运营者自定义。

# 站点信息（前端 /v1/meta 渲染源）
[site]
name = "My Gateway"
domain = "api.example.com"
docs_url = "https://example.com/#/api"
qq_group = ""              # 留空则前端不显示
qq_group_url = ""

[database]
driver = "sqlite"
path = "data/aqua.db"

[server]
listen = "0.0.0.0:8787"

# ===== 上游线：新增一条线 = 追加一个 [[lines]] 块 =====
# 每条线是一套独立的转发 + 计费体系，可混合任意 OpenAI 兼容上游。
[[lines]]
id = "line-a"              # 线标识 = 模型前缀（line-a/model-x）
name = "加速通道"
mode = "per_call"          # 按次计费
base_url = "https://upstream.example.com/v1"
keys = ["sk-your-upstream-key-1", "sk-your-upstream-key-2"]
auth_style = "bearer"      # bearer | x-api-key

[[lines.models]]
site_id = "model-x"        # 站内名：line-a/model-x
upstream_id = "vendor-model-x"
per_call_cost = 1000       # 上游成本（微元/次）——保本线计算，绝不外泄
per_call_sell = 2000       # 售价（微元/次，普通组）

[[lines]]
id = "line-b"
name = "计量通道"
mode = "per_token"         # 按量计费（三段价）
base_url = "https://upstream2.example.com/v1"
keys = ["sk-your-key-1"]
key_face_micro = 67980000  # 每把密钥面值（微元）——面值台账；0=不限
vip_multiplier_num = 9     # vip 折扣 = 普通售价 × 9/10（分数表达，整数零精度损失）
vip_multiplier_den = 10

[[lines.models]]
site_id = "model-y"
upstream_id = "vendor-model-y"
# 成本率（微元/百万tokens）——内部台账，绝不外泄
in_cost_rate10 = 12000000
cache_cost_rate10 = 1500000
out_cost_rate10 = 36000000
# 售价率（rate10 = 微元/千token×10，普通组）
in_sell_rate10 = 60000
cache_sell_rate10 = 7500
out_sell_rate10 = 180000

[[lines.models]]
site_id = "image-model"    # 图片模型：按张计费
upstream_id = "vendor-image-model"
image = true
per_image_cost = 200000    # 成本（微元/张）
per_image_sell = 100000    # 售价（微元/张，普通组）
